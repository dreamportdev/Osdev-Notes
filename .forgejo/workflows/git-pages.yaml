# This workflow is triggered every time a push is made on master.
# It will trigger an HTML build and publish it to username.codeberg.page/osdev-notes
name: Sync Codeberg page

# It will run on every push on master
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    paths-ignore: [ '**/FUNDING.yml', '**/sync-gh-pages.yaml' ]
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y upgrade
          sudo apt-get -y install pandoc pandoc-data
      - name: Build html site
        run: |
          pandoc -v
          pandoc --verbose --standalone --toc -f markdown -t chunkedhtml .pandoc/pandoc.yaml --lua-filter=.pandoc/makerelative.lua -o _site **/*.md -V toc-title="Table Of Contents"
      - name: Upload html site to page
        uses: https://codeberg.org/git-pages/action@v2
        with:
            site: https://${{ forge.repository_owner }}.codeberg.page/Osdev-Notes
            token: ${{ forge.token }}
            source: _site/
            pretty-urls: true
